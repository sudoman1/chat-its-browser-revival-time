<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser.cool by Craxim</title>
  <style>
:root{--bg:#0a0c10;--panel:rgba(20,24,32,0.88);--text:#e8e8ee;--muted:#a8a8b6;--accent:#4a90e2;--line:rgba(255,255,255,0.14);--r:14px;--page-scale:1}*{box-sizing:border-box}html,body{height:100%;margin:0;padding:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#003d57 0%,#3b732d 100%)}body{position:relative;overflow:hidden}.page-viewport{width:100%;height:100svh;padding:16px;overflow:hidden}.page-scale{display:inline-block;transform-origin:top left;transform:scale(var(--page-scale))}.page{position:relative;width:760px;padding:18px 24px 40px;display:flex;flex-direction:column}.page-title{margin:0;padding-top:0;font-size:5.4rem;line-height:.92;letter-spacing:-.06em;font-weight:800;text-shadow:0 18px 40px rgb(0 0 0 / .18)}.page-subtitle{margin:22px 0 0;font-size:1.35rem;line-height:.95;letter-spacing:-.06em;font-weight:800;text-shadow:0 18px 40px rgb(0 0 0 / .18)}.page-tagline{margin:4px 0 0;color:var(--muted);font-size:1.15rem;line-height:.95;font-weight:800;letter-spacing:-.06em;text-shadow:0 18px 40px rgb(0 0 0 / .18)}.page-body{margin:20px 0 0;max-width:720px;color:rgb(232 232 238 / .84);font-size:1.02rem;line-height:1.5;font-weight:400;letter-spacing:0;text-shadow:none}.page-image-wrap{margin:0;width:560px;border-radius:22px;overflow:hidden}.page-image-label{margin:28px 0 10px;color:var(--muted);font-size:.98rem;line-height:.95;font-weight:800;letter-spacing:-.06em;text-shadow:0 18px 40px rgb(0 0 0 / .18)}.page-image{display:block;width:100%;height:auto;object-fit:contain;border-radius:22px}  </style>
</head>
<body>
  <div class="page-viewport">
    <div class="page-scale" id="pageScale">
      <div class="page" id="page">
        <h1 class="page-title">Browser.cool</h1>
        <!-- <div class="page-tagline"><i>The third generation.</i></div> -->
        <div class="page-subtitle">by Craxim</div>
        <div class="page-body">A one-of-a-kind virtual browser.</div>
        <div class="page-body">End internet censorship!<br>Faster than a VPN, sleek features, etc.<br>If something breaks, we recover quickly.</div>
        <div class="page-body">Still a <u>WIP</u>, won't be long until the beta version comes out</div>
        <div class="page-image-label">Here is a small sneek peak!</div>
        <div class="page-image-wrap">
          <img class="page-image" src="/image/prev.png" alt="prev" />
        </div>
      </div>
    </div>
  </div>
  <script src="/js/scale.js"></script>
</body>
</html>
